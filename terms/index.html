<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flick – Terms of Use</title>
<link rel="alternate" hreflang="he" href="https://ofekmoshco.github.io/flick-legal/terms/he/">
<link rel="alternate" hreflang="en" href="https://ofekmoshco.github.io/flick-legal/terms/en/">

<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#6c6c70; --line:#d1d1d6; --soft:#f2f2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f7; --muted:#98989d; --line:#38383a; --soft:#1c1c1e; } }
  body { background:var(--bg); color:var(--fg); font:17px/1.7 -apple-system, system-ui, "Segoe UI", sans-serif; margin:0; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:8px 0 4px; } h2 { font-size:20px; margin:30px 0 8px; }
  p, li { margin:6px 0; } .muted { color:var(--muted); font-size:15px; }
  .box { background:var(--soft); border-radius:12px; padding:12px 16px; margin:16px 0; }
  table { border-collapse:collapse; width:100%; font-size:15px; margin:12px 0; }
  th, td { border:1px solid var(--line); padding:8px 10px; text-align:start; vertical-align:top; }
  th { background:var(--soft); }
  .table-wrap { overflow-x:auto; }
  a { color:inherit; }
  .switcher { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px; font-size:14px; }
  .switcher a { text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:2px 12px; }
  .switcher a[aria-current] { background:var(--soft); font-weight:600; }
  .app .switcher { display:none; }
</style>
<script>
  // Send the reader to their language (keeping ?app=1), else show the list below.
  (function () {
    var codes = ["he","en","es","fr","de","pt","ru","ar"];
    var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().split("-")[0];
    if (lang === "iw") lang = "he";
    if (codes.indexOf(lang) < 0) lang = "en";
    location.replace(lang + "/" + location.search);
  })();
</script>
</head>
<body>
<main>
<h1>Flick – Terms of Use</h1>
<ul>

  <li><a href="es/" lang="es" dir="ltr">Español — Términos de uso</a></li>
  <li><a href="fr/" lang="fr" dir="ltr">Français — Conditions d’utilisation</a></li>
  <li><a href="de/" lang="de" dir="ltr">Deutsch — Nutzungsbedingungen</a></li>
  <li><a href="pt/" lang="pt-BR" dir="ltr">Português (Brasil) — Termos de Uso</a></li>
  <li><a href="ru/" lang="ru" dir="ltr">Русский — Условия использования</a></li>
  <li><a href="ar/" lang="ar" dir="rtl">العربية — شروط الاستخدام</a></li>
</ul>
</main>
</body>
</html>
